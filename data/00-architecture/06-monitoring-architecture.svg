<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker></defs>
<rect width="1500" height="860" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1f2937">6. Monitoring architecture: metrics and logs on AWS</text>
<text x="20" y="52" font-size="13" fill="#64748b">Everything runs in the namespace &quot;monitoring&quot; of the kind cluster on the agent (k8s/monitoring/), deployed by step 8 of deploy.sh.</text>
<rect x="20" y="75" width="1470" height="570" rx="8" fill="#fbfaff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="36" y="98" font-size="14" font-weight="700" fill="#7c3aed">kind cluster on the agent</text>
<text x="40" y="128" font-size="12" font-weight="700" fill="#0891b2">LOGS</text>
<rect x="40" y="140" width="290" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="52" y="162" font-size="14" font-weight="700" fill="#ea580c">Every pod&#x27;s output</text>
<text x="52" y="184" font-size="12" fill="#1f2937">frontend and backend pods</text>
<text x="52" y="201" font-size="12" fill="#1f2937">(questly-ns)</text>
<text x="52" y="218" font-size="12" fill="#1f2937">monitoring pods</text>
<text x="52" y="235" font-size="12" fill="#64748b">Whatever a container prints</text>
<text x="52" y="252" font-size="12" fill="#64748b">to stdout and stderr</text>
<rect x="420" y="140" width="290" height="150" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="432" y="162" font-size="14" font-weight="700" fill="#0891b2">Alloy (Deployment)</text>
<text x="432" y="184" font-size="12" fill="#1f2937">finds every pod through the</text>
<text x="432" y="201" font-size="12" fill="#1f2937">Kubernetes API (RBAC)</text>
<text x="432" y="218" font-size="12" fill="#1f2937">reads its logs, adds labels:</text>
<text x="442" y="235" font-size="12" fill="#1f2937">namespace, pod, container</text>
<rect x="800" y="140" width="300" height="150" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="812" y="162" font-size="14" font-weight="700" fill="#0891b2">Loki (Deployment)</text>
<text x="812" y="184" font-size="12" fill="#1f2937">stores the logs</text>
<text x="812" y="201" font-size="12" fill="#1f2937">Service loki.monitoring:3100</text>
<text x="812" y="218" font-size="12" fill="#64748b">inside the cluster only</text>
<text x="812" y="235" font-size="12" fill="#1f2937">PVC loki-data</text>
<path d="M330 215 L418 215" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a-teal)"/>
<text x="374" y="207" font-size="11" font-weight="700" text-anchor="middle" fill="#0891b2">read</text>
<path d="M710 215 L798 215" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a-teal)"/>
<text x="754" y="207" font-size="11" font-weight="700" text-anchor="middle" fill="#0891b2">push</text>
<text x="754" y="236" font-size="10" text-anchor="middle" fill="#64748b">/loki/api/v1/push</text>
<text x="40" y="338" font-size="12" font-weight="700" fill="#7c3aed">METRICS</text>
<rect x="40" y="350" width="290" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="52" y="372" font-size="14" font-weight="700" fill="#7c3aed">node-exporter (DaemonSet)</text>
<text x="52" y="394" font-size="12" fill="#1f2937">one pod on each of the 2 nodes</text>
<text x="52" y="411" font-size="12" fill="#1f2937">port 9100: CPU, memory, disk,</text>
<text x="52" y="428" font-size="12" fill="#1f2937">network of the node</text>
<rect x="40" y="490" width="290" height="125" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="52" y="512" font-size="14" font-weight="700" fill="#7c3aed">cAdvisor in each kubelet</text>
<text x="52" y="534" font-size="12" fill="#1f2937">CPU and memory per container</text>
<text x="52" y="551" font-size="12" fill="#1f2937">read through the API server:</text>
<text x="52" y="568" font-size="12" fill="#64748b">/api/v1/nodes/&lt;node&gt;/proxy/</text>
<text x="52" y="585" font-size="12" fill="#64748b">metrics/cadvisor</text>
<rect x="420" y="350" width="680" height="265" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="432" y="372" font-size="14" font-weight="700" fill="#7c3aed">Prometheus (Deployment)</text>
<text x="432" y="394" font-size="12" font-weight="700" fill="#1f2937">Scrapes every 15 seconds (prometheus-config ConfigMap):</text>
<text x="442" y="411" font-size="12" fill="#1f2937">job prometheus</text>
<text x="572" y="411" font-size="12" fill="#64748b">itself, localhost:9090</text>
<text x="442" y="428" font-size="12" fill="#1f2937">job node-exporter</text>
<text x="572" y="428" font-size="12" fill="#64748b">each node, port 9100 (found via the Kubernetes API)</text>
<text x="442" y="445" font-size="12" fill="#1f2937">job cadvisor</text>
<text x="572" y="445" font-size="12" fill="#64748b">each node&#x27;s kubelet, through kubernetes.default.svc:443</text>
<text x="432" y="479" font-size="12" fill="#1f2937">Stores the series in PVC prometheus-data</text>
<text x="432" y="496" font-size="12" fill="#1f2937">Service NodePort 30090</text>
<text x="432" y="530" font-size="12" fill="#64748b">Not collected: app-level metrics from the frontend or backend.</text>
<text x="432" y="547" font-size="12" fill="#64748b">The app has no /metrics endpoint; its logs go to Loki instead.</text>
<path d="M330 410 L418 410" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
<text x="374" y="402" font-size="11" font-weight="700" text-anchor="middle" fill="#7c3aed">scrape</text>
<path d="M330 550 L418 550" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
<text x="374" y="542" font-size="11" font-weight="700" text-anchor="middle" fill="#7c3aed">scrape</text>
<rect x="1170" y="140" width="310" height="300" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
<text x="1182" y="162" font-size="14" font-weight="700" fill="#db2777">Grafana (Deployment)</text>
<text x="1182" y="184" font-size="12" font-weight="700" fill="#1f2937">Data sources (ConfigMap):</text>
<text x="1182" y="201" font-size="12" fill="#1f2937">Prometheus</text>
<text x="1182" y="218" font-size="11" fill="#64748b">http://prometheus.monitoring:9090</text>
<text x="1182" y="235" font-size="12" fill="#1f2937">Loki</text>
<text x="1182" y="252" font-size="11" fill="#64748b">http://loki.monitoring:3100</text>
<text x="1182" y="286" font-size="12" fill="#1f2937">PVC grafana-data</text>
<text x="1182" y="303" font-size="12" fill="#1f2937">Service NodePort 30030</text>
<text x="1182" y="337" font-size="12" font-weight="700" fill="#1f2937">Login: user admin, password in</text>
<text x="1182" y="354" font-size="12" font-weight="700" fill="#1f2937">the secret grafana-admin</text>
<path d="M1100 215 L1168 215" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#a-pink)"/>
<text x="1134" y="207" font-size="11" font-weight="700" text-anchor="middle" fill="#db2777">logs</text>
<path d="M1100 480 L1135 480 L1135 400 L1168 400" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#a-pink)"/>
<text x="1104" y="497" font-size="11" font-weight="700" fill="#db2777">metrics</text>
<text x="20" y="672" font-size="12" font-weight="700" fill="#ea580c">HOW YOU OPEN THEM: neither is public</text>
<rect x="20" y="685" width="300" height="160" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="32" y="707" font-size="14" font-weight="700" fill="#1f2937">Your laptop</text>
<text x="32" y="729" font-size="12" fill="#1f2937">terraform output -raw</text>
<text x="32" y="746" font-size="12" fill="#1f2937">monitoring_tunnel</text>
<text x="32" y="763" font-size="12" fill="#1f2937">run the SSH command it prints</text>
<text x="32" y="780" font-size="12" font-weight="700" fill="#1f2937">Then open:</text>
<text x="32" y="797" font-size="12" fill="#1f2937">http://localhost:30030  Grafana</text>
<text x="32" y="814" font-size="12" fill="#1f2937">http://localhost:30090  Prometheus</text>
<rect x="420" y="685" width="320" height="160" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="432" y="707" font-size="14" font-weight="700" fill="#2563eb">Master (questly-dev-master)</text>
<text x="432" y="729" font-size="12" fill="#1f2937">SSH on port 22, from your IP only</text>
<text x="432" y="746" font-size="12" fill="#1f2937">forwards both ports to the agent</text>
<text x="432" y="763" font-size="11" fill="#64748b">ssh -L 30030:&lt;agent-ip&gt;:30030</text>
<text x="432" y="780" font-size="11" fill="#64748b">    -L 30090:&lt;agent-ip&gt;:30090</text>
<rect x="840" y="685" width="300" height="160" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="852" y="707" font-size="14" font-weight="700" fill="#ea580c">Agent ports 30030 / 30090</text>
<text x="852" y="729" font-size="12" fill="#1f2937">allowed only from the master&#x27;s</text>
<text x="852" y="746" font-size="12" fill="#1f2937">security group</text>
<text x="852" y="763" font-size="12" fill="#1f2937">→ kind node → Grafana /</text>
<text x="852" y="780" font-size="12" fill="#1f2937">Prometheus Service</text>
<path d="M320 765 L418 765" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
<text x="369" y="757" font-size="11" font-weight="700" text-anchor="middle" fill="#ea580c">SSH tunnel</text>
<path d="M740 765 L838 765" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
<text x="789" y="757" font-size="11" font-weight="700" text-anchor="middle" fill="#ea580c">forward</text>
<path d="M1140 765 L1155 765 L1155 455 L1200 455 L1200 442" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
<text x="1208" y="470" font-size="11" font-weight="700" fill="#ea580c">reaches Grafana</text>
<rect x="1210" y="685" width="270" height="160" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1222" y="707" font-size="14" font-weight="700" fill="#1f2937">Same idea on a laptop</text>
<text x="1222" y="729" font-size="12" fill="#1f2937">docker-compose.yml runs the same</text>
<text x="1222" y="746" font-size="12" fill="#1f2937">tools as containers. Differences:</text>
<text x="1222" y="763" font-size="12" fill="#1f2937">• a cAdvisor container instead</text>
<text x="1232" y="780" font-size="12" fill="#1f2937">of the kubelet&#x27;s cAdvisor</text>
<text x="1222" y="797" font-size="12" fill="#1f2937">• Alloy reads logs from docker.sock</text>
<text x="1222" y="814" font-size="12" fill="#1f2937">• Grafana on localhost:3002</text>
</svg>

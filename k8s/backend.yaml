apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: questly
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: questly-backend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: NODE_ENV
              value: "production"

          envFrom:
            - secretRef:
                name: questly-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: questly
spec:
  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      nodePort: 30081

  type: NodePort

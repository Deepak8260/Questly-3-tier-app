<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker></defs>
<rect width="1500" height="900" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1f2937">2. Container architecture: how the images are built and run</text>
<text x="20" y="52" font-size="13" fill="#64748b">Part A: the multi-stage Dockerfiles. Part B: the full stack on a laptop with docker-compose.yml.</text>
<text x="20" y="88" font-size="15" font-weight="700" fill="#2563eb">A. How each image is built (multi-stage Dockerfile)</text>
<rect x="20" y="105" width="200" height="160" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="32" y="127" font-size="14" font-weight="700" fill="#1f2937">frontend/</text>
<text x="32" y="149" font-size="12" fill="#1f2937">source code</text>
<text x="32" y="167" font-size="12" fill="#1f2937">Dockerfile</text>
<text x="32" y="185" font-size="12" fill="#1f2937">.dockerignore</text>
<text x="32" y="203" font-size="11" fill="#64748b">keeps out .env, node_modules,</text>
<text x="32" y="221" font-size="11" fill="#64748b">.git, .next, dist</text>
<rect x="270" y="105" width="300" height="160" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="282" y="127" font-size="14" font-weight="700" fill="#d97706">Stage 1: builder</text>
<text x="282" y="145" font-size="11" fill="#64748b">FROM node:22-slim AS builder</text>
<text x="282" y="167" font-size="12" fill="#1f2937">npm ci</text>
<text x="282" y="185" font-size="12" fill="#1f2937">copy the source</text>
<text x="282" y="203" font-size="12" fill="#1f2937">npm run build</text>
<text x="282" y="221" font-size="12" fill="#64748b">(Next.js standalone output)</text>
<rect x="620" y="105" width="330" height="160" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="632" y="127" font-size="14" font-weight="700" fill="#2563eb">Stage 2: runtime (the final image)</text>
<text x="632" y="145" font-size="11" fill="#64748b">FROM gcr.io/distroless/nodejs22-debian12</text>
<text x="632" y="167" font-size="12" fill="#1f2937">copies only:</text>
<text x="642" y="185" font-size="12" fill="#1f2937">.next/standalone, .next/static,</text>
<text x="642" y="203" font-size="12" fill="#1f2937">public/, docker-entrypoint.js</text>
<text x="632" y="221" font-size="12" fill="#1f2937">EXPOSE 3000</text>
<text x="632" y="239" font-size="12" fill="#1f2937">CMD [&quot;docker-entrypoint.js&quot;]</text>
<rect x="1000" y="105" width="270" height="160" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1012" y="127" font-size="14" font-weight="700" fill="#0891b2">Docker Hub</text>
<text x="1012" y="149" font-size="12" fill="#1f2937">kumar3472/questly-frontend:latest</text>
<text x="1012" y="185" font-size="12" fill="#64748b">pushed from the laptop with</text>
<text x="1012" y="203" font-size="12" fill="#64748b">docker push</text>
<path d="M220 185 L268 185" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-grey)"/>
<path d="M570 185 L618 185" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/>
<text x="594" y="177" font-size="11" font-weight="700" text-anchor="middle" fill="#d97706">copy</text>
<path d="M950 185 L998 185" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
<text x="974" y="177" font-size="11" font-weight="700" text-anchor="middle" fill="#2563eb">push</text>
<rect x="20" y="285" width="200" height="160" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="32" y="307" font-size="14" font-weight="700" fill="#1f2937">backend/</text>
<text x="32" y="329" font-size="12" fill="#1f2937">source code</text>
<text x="32" y="347" font-size="12" fill="#1f2937">Dockerfile</text>
<text x="32" y="365" font-size="12" fill="#1f2937">.dockerignore</text>
<text x="32" y="383" font-size="11" fill="#64748b">keeps out .env, node_modules,</text>
<text x="32" y="401" font-size="11" fill="#64748b">.git, .next, dist</text>
<rect x="270" y="285" width="300" height="160" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="282" y="307" font-size="14" font-weight="700" fill="#d97706">Stage 1: builder</text>
<text x="282" y="325" font-size="11" fill="#64748b">FROM node:22-slim AS builder</text>
<text x="282" y="347" font-size="12" fill="#1f2937">npm ci</text>
<text x="282" y="365" font-size="12" fill="#1f2937">copy the source</text>
<text x="282" y="383" font-size="12" fill="#1f2937">npm run build (tsc → dist/)</text>
<text x="282" y="401" font-size="12" fill="#1f2937">npm prune --omit=dev</text>
<rect x="620" y="285" width="330" height="160" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="632" y="307" font-size="14" font-weight="700" fill="#2563eb">Stage 2: runtime (the final image)</text>
<text x="632" y="325" font-size="11" fill="#64748b">FROM gcr.io/distroless/nodejs22-debian12</text>
<text x="632" y="347" font-size="12" fill="#1f2937">copies only:</text>
<text x="642" y="365" font-size="12" fill="#1f2937">node_modules (production),</text>
<text x="642" y="383" font-size="12" fill="#1f2937">dist/, package.json</text>
<text x="632" y="401" font-size="12" fill="#1f2937">EXPOSE 3001</text>
<text x="632" y="419" font-size="12" fill="#1f2937">CMD [&quot;dist/index.js&quot;]</text>
<rect x="1000" y="285" width="270" height="160" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1012" y="307" font-size="14" font-weight="700" fill="#0891b2">Docker Hub</text>
<text x="1012" y="329" font-size="12" fill="#1f2937">kumar3472/questly-backend:latest</text>
<text x="1012" y="365" font-size="12" fill="#64748b">pushed from the laptop with</text>
<text x="1012" y="383" font-size="12" fill="#64748b">docker push</text>
<path d="M220 365 L268 365" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-grey)"/>
<path d="M570 365 L618 365" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/>
<text x="594" y="357" font-size="11" font-weight="700" text-anchor="middle" fill="#d97706">copy</text>
<path d="M950 365 L998 365" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
<text x="974" y="357" font-size="11" font-weight="700" text-anchor="middle" fill="#2563eb">push</text>
<rect x="1300" y="105" width="180" height="340" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1312" y="127" font-size="14" font-weight="700" fill="#1f2937">Why it is built this way</text>
<text x="1312" y="149" font-size="12" font-weight="700" fill="#1f2937">Two stages</text>
<text x="1312" y="166" font-size="12" fill="#1f2937">Build tools stay in</text>
<text x="1312" y="183" font-size="12" fill="#1f2937">stage 1 and are thrown</text>
<text x="1312" y="200" font-size="12" fill="#1f2937">away.</text>
<text x="1312" y="217" font-size="12" font-weight="700" fill="#1f2937">Distroless</text>
<text x="1312" y="234" font-size="12" fill="#1f2937">No shell, no package</text>
<text x="1312" y="251" font-size="12" fill="#1f2937">manager: smaller and</text>
<text x="1312" y="268" font-size="12" fill="#1f2937">safer. Frontend image:</text>
<text x="1312" y="285" font-size="12" fill="#1f2937">1.7 GB → 311 MB.</text>
<text x="1312" y="302" font-size="12" font-weight="700" fill="#1f2937">No secrets inside</text>
<text x="1312" y="319" font-size="12" fill="#1f2937">.env is never copied in.</text>
<text x="1312" y="336" font-size="12" fill="#1f2937">Values are read when</text>
<text x="1312" y="353" font-size="12" fill="#1f2937">the container starts.</text>
<text x="20" y="488" font-size="15" font-weight="700" fill="#16a34a">B. Running the whole stack on a laptop: docker-compose.yml</text>
<rect x="20" y="500" width="1260" height="380" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="36" y="522" font-size="12" font-weight="700" fill="#16a34a">Docker network: qnet  (containers reach each other by name, such as http://loki:3100)</text>
<rect x="40" y="540" width="190" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="52" y="562" font-size="13" font-weight="700" fill="#ea580c">frontend</text>
<text x="52" y="584" font-size="11.5" fill="#1f2937">questly-frontend</text>
<text x="52" y="601" font-size="11.5" fill="#1f2937">port 3000 → 3000</text>
<text x="52" y="618" font-size="11.5" fill="#1f2937">env_file frontend/.env</text>
<text x="52" y="635" font-size="11.5" fill="#1f2937">starts after backend</text>
<rect x="250" y="540" width="190" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="262" y="562" font-size="13" font-weight="700" fill="#ea580c">backend</text>
<text x="262" y="584" font-size="11.5" fill="#1f2937">questly-backend</text>
<text x="262" y="601" font-size="11.5" fill="#1f2937">port 3001 → 3001</text>
<text x="262" y="618" font-size="11.5" fill="#1f2937">env_file backend/.env</text>
<rect x="460" y="540" width="190" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="472" y="562" font-size="13" font-weight="700" fill="#1f2937">redis</text>
<text x="472" y="584" font-size="11.5" fill="#1f2937">redis:latest</text>
<text x="472" y="601" font-size="11.5" fill="#1f2937">internal 6379 only</text>
<text x="472" y="618" font-size="11.5" fill="#64748b">not used by the app</text>
<text x="472" y="635" font-size="11.5" fill="#64748b">code yet</text>
<rect x="40" y="735" width="170" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="52" y="757" font-size="13" font-weight="700" fill="#7c3aed">cadvisor</text>
<text x="52" y="779" font-size="11.5" fill="#1f2937">container metrics</text>
<text x="52" y="796" font-size="11.5" fill="#1f2937">port 8081 → 8080</text>
<rect x="250" y="735" width="170" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="262" y="757" font-size="13" font-weight="700" fill="#7c3aed">node-exporter</text>
<text x="262" y="779" font-size="11.5" fill="#1f2937">machine metrics</text>
<text x="262" y="796" font-size="11.5" fill="#1f2937">internal 9100</text>
<rect x="460" y="735" width="170" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="472" y="757" font-size="13" font-weight="700" fill="#7c3aed">prometheus</text>
<text x="472" y="779" font-size="11.5" fill="#1f2937">port 9090 → 9090</text>
<text x="472" y="796" font-size="11.5" fill="#1f2937">prometheus.yml</text>
<text x="472" y="813" font-size="11.5" fill="#1f2937">prometheus_data</text>
<rect x="670" y="735" width="170" height="120" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
<text x="682" y="757" font-size="13" font-weight="700" fill="#db2777">grafana</text>
<text x="682" y="779" font-size="11.5" fill="#1f2937">port 3002 → 3000</text>
<text x="682" y="796" font-size="11.5" fill="#1f2937">grafana-storage</text>
<rect x="880" y="735" width="170" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="892" y="757" font-size="13" font-weight="700" fill="#0891b2">loki</text>
<text x="892" y="779" font-size="11.5" fill="#1f2937">loki:3.7.0</text>
<text x="892" y="796" font-size="11.5" fill="#1f2937">internal 3100</text>
<text x="892" y="813" font-size="11.5" fill="#1f2937">loki-config.yml</text>
<text x="892" y="830" font-size="11.5" fill="#1f2937">loki_data</text>
<rect x="1090" y="735" width="170" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1102" y="757" font-size="13" font-weight="700" fill="#0891b2">alloy</text>
<text x="1102" y="779" font-size="11.5" fill="#1f2937">reads container</text>
<text x="1102" y="796" font-size="11.5" fill="#1f2937">logs from</text>
<text x="1102" y="813" font-size="11.5" fill="#1f2937">docker.sock</text>
<text x="1102" y="830" font-size="11.5" fill="#1f2937">alloy_data</text>
<path d="M230 660 L230 690 L345 690 L345 662" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a-grey)"/>
<text x="287" y="684" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">depends_on</text>
<path d="M125 735 L125 712 L520 712 L520 733" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
<text x="322" y="706" font-size="11" font-weight="700" text-anchor="middle" fill="#7c3aed">scraped by Prometheus</text>
<path d="M420 795 L458 795" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
<path d="M630 795 L668 795" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#a-pink)"/>
<path d="M880 795 L842 795" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#a-pink)"/>
<path d="M1090 795 L1052 795" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a-teal)"/>
<text x="755" y="873" font-size="11" font-weight="700" text-anchor="middle" fill="#db2777">Grafana shows Prometheus metrics and Loki logs</text>
<text x="1070" y="873" font-size="11" font-weight="700" text-anchor="middle" fill="#0891b2">Alloy pushes logs to Loki</text>
<rect x="1300" y="500" width="180" height="380" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1312" y="522" font-size="14" font-weight="700" fill="#1f2937">On your laptop</text>
<text x="1312" y="544" font-size="12" font-weight="700" fill="#1f2937">Open in the browser:</text>
<text x="1312" y="561" font-size="12" fill="#1f2937">localhost:3000</text>
<text x="1322" y="578" font-size="12" fill="#64748b">the app</text>
<text x="1312" y="595" font-size="12" fill="#1f2937">localhost:3001/health</text>
<text x="1322" y="612" font-size="12" fill="#64748b">the API</text>
<text x="1312" y="629" font-size="12" fill="#1f2937">localhost:9090</text>
<text x="1322" y="646" font-size="12" fill="#64748b">Prometheus</text>
<text x="1312" y="663" font-size="12" fill="#1f2937">localhost:3002</text>
<text x="1322" y="680" font-size="12" fill="#64748b">Grafana</text>
<text x="1312" y="697" font-size="12" fill="#1f2937">localhost:8081</text>
<text x="1322" y="714" font-size="12" fill="#64748b">cAdvisor</text>
<text x="1312" y="748" font-size="12" font-weight="700" fill="#1f2937">Start everything:</text>
<text x="1312" y="765" font-size="12" fill="#1f2937">docker compose up -d</text>
</svg>

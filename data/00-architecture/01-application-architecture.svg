<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker></defs>
<rect width="1500" height="880" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1f2937">1. Application architecture: the three tiers and who talks to whom</text>
<text x="20" y="52" font-size="13" fill="#64748b">The same on a laptop and on AWS. Only the addresses change.</text>
<text x="20" y="86" font-size="13" font-weight="700" fill="#2563eb">Presentation tier: browser</text>
<text x="430" y="86" font-size="13" font-weight="700" fill="#ea580c">Presentation + application tier</text>
<text x="860" y="86" font-size="13" font-weight="700" fill="#16a34a">Data tier and outside services</text>
<rect x="20" y="100" width="310" height="660" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="32" y="122" font-size="14" font-weight="700" fill="#2563eb">User&#x27;s browser</text>
<text x="32" y="144" font-size="12" font-weight="700" fill="#1f2937">React pages served by Next.js:</text>
<text x="32" y="162" font-size="12" fill="#1f2937">/   /login   /signup</text>
<text x="32" y="180" font-size="12" font-weight="700" fill="#1f2937">/dashboard:</text>
<text x="44" y="198" font-size="12" fill="#1f2937">generate, quizzes, battles,</text>
<text x="44" y="216" font-size="12" fill="#1f2937">contests, leaderboard,</text>
<text x="44" y="234" font-size="12" fill="#1f2937">analytics, certificates,</text>
<text x="44" y="252" font-size="12" fill="#1f2937">roadmap, settings</text>
<text x="32" y="270" font-size="12" font-weight="700" fill="#1f2937">/admin:</text>
<text x="44" y="288" font-size="12" fill="#1f2937">users, quizzes, contests,</text>
<text x="44" y="306" font-size="12" fill="#1f2937">analytics, activity, explorer,</text>
<text x="44" y="324" font-size="12" fill="#1f2937">certificates, settings</text>
<text x="32" y="360" font-size="12" font-weight="700" fill="#1f2937">Reads its settings from /__ENV.js</text>
<text x="32" y="378" font-size="12" fill="#64748b">(the NEXT_PUBLIC_* values)</text>
<text x="32" y="414" font-size="12" font-weight="700" fill="#1f2937">Talks to three places:</text>
<text x="32" y="432" font-size="12" fill="#2563eb">1. Next.js server: the pages</text>
<text x="32" y="450" font-size="12" fill="#ea580c">2. Backend: generate, save score</text>
<text x="32" y="468" font-size="12" fill="#16a34a">3. Supabase: login, data, live</text>
<text x="32" y="486" font-size="12" fill="#16a34a">    updates</text>
<rect x="430" y="100" width="330" height="320" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="442" y="122" font-size="14" font-weight="700" fill="#ea580c">Frontend: Next.js 16 on Node 22</text>
<text x="442" y="140" font-size="11" fill="#64748b">port 3000 · image kumar3472/questly-frontend</text>
<text x="442" y="162" font-size="12" fill="#1f2937">• Renders the pages (frontend/app/)</text>
<text x="442" y="180" font-size="12" fill="#1f2937">• middleware.ts runs on every request:</text>
<text x="452" y="198" font-size="12" fill="#1f2937">checks the login session with</text>
<text x="452" y="216" font-size="12" fill="#1f2937">Supabase, sends guests to /login</text>
<text x="442" y="234" font-size="12" fill="#1f2937">• docker-entrypoint.js, at start:</text>
<text x="452" y="252" font-size="12" fill="#1f2937">writes public/__ENV.js from the</text>
<text x="452" y="270" font-size="12" fill="#1f2937">container&#x27;s env values</text>
<text x="442" y="288" font-size="12" fill="#1f2937">• /api/debug-env: shows the settings</text>
<rect x="430" y="460" width="330" height="300" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="442" y="482" font-size="14" font-weight="700" fill="#ea580c">Backend: Express 5 on Node 22</text>
<text x="442" y="500" font-size="11" fill="#64748b">port 3001 · image kumar3472/questly-backend</text>
<text x="442" y="522" font-size="12" font-weight="700" fill="#1f2937">POST /api/quiz/generate</text>
<text x="452" y="540" font-size="12" fill="#1f2937">→ asks Gemini for questions</text>
<text x="442" y="558" font-size="12" font-weight="700" fill="#1f2937">POST /api/quiz/save-attempt</text>
<text x="452" y="576" font-size="12" fill="#1f2937">→ saves the score in Supabase</text>
<text x="442" y="594" font-size="12" font-weight="700" fill="#1f2937">POST /api/quiz/init-db</text>
<text x="442" y="612" font-size="12" font-weight="700" fill="#1f2937">GET /health</text>
<text x="452" y="630" font-size="12" fill="#1f2937">→ load balancer health check</text>
<text x="442" y="666" font-size="12" fill="#64748b">Uses the service_role key and the</text>
<text x="442" y="684" font-size="12" fill="#64748b">Gemini key. Both stay on the server.</text>
<rect x="860" y="100" width="360" height="500" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="872" y="122" font-size="14" font-weight="700" fill="#16a34a">Supabase (managed, outside AWS)</text>
<text x="872" y="144" font-size="12" font-weight="700" fill="#1f2937">Auth</text>
<text x="882" y="162" font-size="12" fill="#1f2937">sign up, sign in, sessions</text>
<text x="872" y="180" font-size="12" font-weight="700" fill="#1f2937">Postgres tables</text>
<text x="882" y="198" font-size="12" fill="#1f2937">profiles, questly_quiz_attempts</text>
<text x="882" y="216" font-size="12" fill="#1f2937">quiz_battles, battle_answers,</text>
<text x="882" y="234" font-size="12" fill="#1f2937">battle_results</text>
<text x="882" y="252" font-size="12" fill="#1f2937">contests, contest_participants,</text>
<text x="882" y="270" font-size="12" fill="#1f2937">contest_answers, contest_results</text>
<text x="882" y="288" font-size="12" fill="#1f2937">admin_settings</text>
<text x="882" y="306" font-size="12" fill="#64748b">Row Level Security limits what each</text>
<text x="882" y="324" font-size="12" fill="#64748b">user may read and write</text>
<text x="872" y="342" font-size="12" font-weight="700" fill="#1f2937">Realtime</text>
<text x="882" y="360" font-size="12" fill="#1f2937">live battles and contests</text>
<text x="872" y="378" font-size="12" font-weight="700" fill="#1f2937">Edge Function</text>
<text x="882" y="396" font-size="12" fill="#1f2937">auto-start-contests</text>
<text x="872" y="414" font-size="12" font-weight="700" fill="#1f2937">Schema</text>
<text x="882" y="432" font-size="12" fill="#1f2937">database/supabase/migrations/</text>
<rect x="860" y="640" width="360" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="872" y="662" font-size="14" font-weight="700" fill="#7c3aed">Google Gemini API</text>
<text x="872" y="684" font-size="12" fill="#1f2937">generateContent</text>
<text x="872" y="702" font-size="12" fill="#1f2937">tries gemini-2.0-flash, then 2.5-flash,</text>
<text x="872" y="720" font-size="12" fill="#1f2937">then 1.5-flash</text>
<rect x="1260" y="100" width="220" height="210" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1272" y="122" font-size="14" font-weight="700" fill="#1f2937">The three tiers</text>
<text x="1272" y="144" font-size="12" font-weight="700" fill="#1f2937">1. Presentation</text>
<text x="1282" y="162" font-size="12" fill="#1f2937">Next.js pages in the browser,</text>
<text x="1282" y="180" font-size="12" fill="#1f2937">rendered by the Next.js server</text>
<text x="1272" y="198" font-size="12" font-weight="700" fill="#1f2937">2. Application</text>
<text x="1282" y="216" font-size="12" fill="#1f2937">Express API: AI and scores</text>
<text x="1272" y="234" font-size="12" font-weight="700" fill="#1f2937">3. Data</text>
<text x="1282" y="252" font-size="12" fill="#1f2937">Supabase Postgres</text>
<rect x="1260" y="330" width="220" height="250" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1272" y="352" font-size="14" font-weight="700" fill="#1f2937">Which key is used where</text>
<text x="1272" y="374" font-size="12" font-weight="700" fill="#1f2937">Browser and Next.js</text>
<text x="1282" y="392" font-size="12" fill="#1f2937">Supabase anon key</text>
<text x="1282" y="410" font-size="12" fill="#64748b">Public on purpose; RLS</text>
<text x="1282" y="428" font-size="12" fill="#64748b">limits what it can do</text>
<text x="1272" y="446" font-size="12" font-weight="700" fill="#1f2937">Backend only</text>
<text x="1282" y="464" font-size="12" fill="#1f2937">Supabase service_role key</text>
<text x="1282" y="482" font-size="12" fill="#1f2937">Gemini API key</text>
<text x="1282" y="500" font-size="12" fill="#64748b">Secret: never sent to the</text>
<text x="1282" y="518" font-size="12" fill="#64748b">browser</text>
<text x="1272" y="536" font-size="12" fill="#64748b">Values: Jenkins guide 3</text>
<rect x="1260" y="600" width="220" height="136" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="1274" y="622" font-size="13" font-weight="700" fill="#1f2937">Arrows</text>
<line x1="1274" y1="640" x2="1306" y2="640" stroke="#2563eb" stroke-width="3"/>
<text x="1316" y="644" font-size="11.5" fill="#1f2937">pages</text>
<line x1="1274" y1="660" x2="1306" y2="660" stroke="#ea580c" stroke-width="3"/>
<text x="1316" y="664" font-size="11.5" fill="#1f2937">API calls</text>
<line x1="1274" y1="680" x2="1306" y2="680" stroke="#16a34a" stroke-width="3"/>
<text x="1316" y="684" font-size="11.5" fill="#1f2937">Supabase</text>
<line x1="1274" y1="700" x2="1306" y2="700" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/>
<text x="1316" y="704" font-size="11.5" fill="#1f2937">session check</text>
<line x1="1274" y1="720" x2="1306" y2="720" stroke="#7c3aed" stroke-width="3"/>
<text x="1316" y="724" font-size="11.5" fill="#1f2937">AI request</text>
<path d="M330 180 L428 180" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
<text x="379" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#2563eb">pages</text>
<path d="M330 560 L428 560" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
<text x="379" y="538" font-size="11" font-weight="700" text-anchor="middle" fill="#ea580c">POST</text>
<text x="379" y="552" font-size="11" font-weight="700" text-anchor="middle" fill="#ea580c">/api/quiz/*</text>
<text x="379" y="580" font-size="10" text-anchor="middle" fill="#64748b">NEXT_PUBLIC_</text>
<text x="379" y="592" font-size="10" text-anchor="middle" fill="#64748b">API_BASE_URL</text>
<path d="M760 270 L858 270" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#a-green)"/>
<text x="809" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#16a34a">check</text>
<text x="809" y="262" font-size="11" font-weight="700" text-anchor="middle" fill="#16a34a">session</text>
<path d="M760 540 L858 540" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/>
<text x="809" y="518" font-size="11" font-weight="700" text-anchor="middle" fill="#16a34a">service_role</text>
<text x="809" y="532" font-size="11" font-weight="700" text-anchor="middle" fill="#16a34a">save score</text>
<path d="M760 700 L858 700" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
<text x="809" y="692" font-size="11" font-weight="700" text-anchor="middle" fill="#7c3aed">generate</text>
<path d="M175 760 L175 812 L1240 812 L1240 350 L1222 350" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/>
<text x="560" y="830" font-size="11" font-weight="700" fill="#16a34a">anon key: sign in, read and write tables (RLS), realtime updates</text>
</svg>

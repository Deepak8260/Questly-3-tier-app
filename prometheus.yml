# ==========================================
# GLOBAL CONFIGURATION
# ==========================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s


# ==========================================
# ALERTMANAGER CONFIGURATION
# ==========================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093


# ==========================================
# RULE FILES
# ==========================================
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"


# ==========================================
# SCRAPE CONFIGURATIONS
# ==========================================
scrape_configs:

  # ========================================
  # PROMETHEUS
  # ========================================
  - job_name: "prometheus"

    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          app: "prometheus"

    scrape_native_histograms: true


  # ========================================
  # CADVISOR - DOCKER CONTAINERS
  # ========================================
  - job_name: "cadvisor"

    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          app: "docker"
          service: "cadvisor"


  # ========================================
  # NODE EXPORTER - HOST METRICS
  # ========================================
  - job_name: "node-exporter"

    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          app: "node"
          service: "node-exporter"


  # ========================================
  # QUESTLY BACKEND
  # COMMENTED OUT - ENABLE WHEN /metrics
  # ENDPOINT IS IMPLEMENTED

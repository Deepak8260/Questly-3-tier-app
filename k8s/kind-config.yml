kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP

      - containerPort: 30081
        hostPort: 30081
        protocol: TCP

      # Observability
      - containerPort: 30030          # Grafana
        hostPort: 30030
        protocol: TCP

      - containerPort: 30090          # Prometheus
        hostPort: 30090
        protocol: TCP

  - role: worker

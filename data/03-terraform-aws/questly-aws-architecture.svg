<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>

  <rect width="1600" height="1030" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="700">Questly on AWS: as configured in terraform/</text>

  <!-- ============ LEFT: outside the VPC ============ -->
  <rect x="20" y="44" width="280" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="36" y="70" font-size="14" font-weight="700">Users (internet)</text>
  <text x="36" y="90">open https://questly.kumardevops.online</text>

  <rect x="20" y="124" width="280" height="64" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="36" y="150" font-size="14" font-weight="700">You: admin laptop</text>
  <text x="36" y="170">your IP (admin_cidrs) + your SSH private key</text>

  <rect x="20" y="210" width="280" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="36" y="236" font-size="14" font-weight="700">Your DNS provider (outside AWS)</text>
  <text x="36" y="258" font-style="italic">Added by hand, not by Terraform:</text>
  <text x="36" y="282">1. questly.kumardevops.online</text>
  <text x="50" y="300">CNAME → ALB DNS name</text>
  <text x="50" y="318" fill="#64748b">(output alb_dns_name)</text>
  <text x="36" y="342">2. ACM validation CNAME</text>
  <text x="50" y="360" fill="#64748b">(output acm_validation_record)</text>

  <rect x="20" y="400" width="280" height="110" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="36" y="426" font-size="14" font-weight="700">AWS Certificate Manager</text>
  <text x="36" y="448">Certificate for questly.kumardevops.online</text>
  <text x="36" y="468">Pending → Issued once record 2 exists</text>
  <text x="36" y="488">Used by the HTTPS 443 listener</text>

  <rect x="20" y="530" width="280" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4"/>
  <text x="36" y="556" font-size="14" font-weight="700">Outside services the agent calls</text>
  <text x="36" y="578">Docker Hub: app images</text>
  <text x="36" y="598">Supabase: the database</text>
  <text x="36" y="618">Gemini API</text>
  <text x="36" y="638">GitHub, apt packages</text>

  <rect x="20" y="670" width="280" height="190" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="36" y="696" font-size="14" font-weight="700">Not created by Terraform</text>
  <text x="36" y="720">• The two DNS records (above)</text>
  <text x="36" y="742">• Software inside the servers</text>
  <text x="48" y="760" fill="#64748b">(boot scripts install it after apply)</text>
  <text x="36" y="782">• The Questly app</text>
  <text x="48" y="800" fill="#64748b">(deployed later by Jenkins)</text>
  <text x="36" y="822">• No Route 53, no 2nd NAT gateway,</text>
  <text x="48" y="840">no private subnet in AZ 2</text>

  <!-- ============ VPC ============ -->
  <text x="790" y="34" font-size="15" font-weight="700" text-anchor="middle">Internet</text>
  <rect x="320" y="80" width="950" height="930" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="340" y="112" font-size="15" font-weight="700" fill="#15803d">VPC 10.0.0.0/16 (questly-dev-vpc)</text>
  <text x="1250" y="112" font-size="13" text-anchor="end" fill="#15803d">region ap-south-1 (Mumbai)</text>

  <rect x="700" y="60" width="180" height="44" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="790" y="80" font-size="13" font-weight="700" text-anchor="middle">Internet gateway</text>
  <text x="790" y="96" font-size="11" text-anchor="middle">questly-dev-igw</text>

  <!-- Availability zones -->
  <rect x="340" y="130" width="440" height="690" rx="10" fill="none" stroke="#60a5fa" stroke-dasharray="8 5"/>
  <text x="356" y="152" font-size="14" font-weight="700" fill="#2563eb">Availability Zone 1</text>
  <rect x="800" y="130" width="450" height="690" rx="10" fill="none" stroke="#60a5fa" stroke-dasharray="8 5"/>
  <text x="816" y="152" font-size="14" font-weight="700" fill="#2563eb">Availability Zone 2</text>

  <!-- Public subnets -->
  <rect x="355" y="165" width="410" height="335" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="370" y="186" font-size="13" font-weight="700" fill="#15803d">Public subnet 1 · 10.0.0.0/24</text>
  <rect x="815" y="165" width="420" height="335" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="830" y="186" font-size="13" font-weight="700" fill="#15803d">Public subnet 2 · 10.0.1.0/24</text>
  <text x="830" y="212">Only the ALB uses this subnet.</text>
  <text x="830" y="230">No NAT gateway, no EC2 here.</text>

  <!-- NAT -->
  <rect x="370" y="200" width="170" height="90" rx="8" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="384" y="222" font-weight="700">NAT gateway (only one)</text>
  <text x="384" y="240">questly-dev-nat</text>
  <text x="384" y="258">+ Elastic IP (nat-eip)</text>
  <text x="384" y="276" fill="#15803d">agent's way out</text>

  <!-- Master -->
  <rect x="560" y="200" width="195" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="572" y="222" font-size="13" font-weight="700">Master EC2 · Jenkins</text>
  <text x="572" y="240">questly-dev-master</text>
  <text x="572" y="258">t3.medium · 18 GB gp3</text>
  <text x="572" y="276">Ubuntu 24.04</text>
  <text x="572" y="294">Installs Java 21 + Jenkins</text>
  <text x="572" y="312">SG: questly-dev-master-sg</text>
  <text x="572" y="330">Key: questly-dev-key</text>
  <text x="572" y="348" font-weight="700">Public IP: Elastic IP</text>
  <text x="572" y="366">(questly-dev-master-eip)</text>

  <!-- ALB -->
  <rect x="370" y="405" width="850" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="795" y="427" font-size="14" font-weight="700" text-anchor="middle">Application Load Balancer · questly-dev-alb</text>
  <text x="795" y="445" text-anchor="middle">One ALB with nodes in both public subnets · SG questly-dev-alb-sg</text>
  <text x="795" y="463" text-anchor="middle">HTTP 80 → 301 redirect to HTTPS    |    HTTPS 443 with the ACM certificate</text>
  <text x="795" y="481" text-anchor="middle">default → frontend target group (30080)    |    /api/* → backend target group (30081)</text>

  <!-- Private subnets -->
  <rect x="355" y="530" width="410" height="280" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="370" y="551" font-size="13" font-weight="700" fill="#1d4ed8">Private subnet · 10.0.10.0/24</text>
  <rect x="815" y="530" width="420" height="280" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="1025" y="650" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">No private subnet in AZ 2</text>
  <text x="1025" y="676" text-anchor="middle" fill="#64748b">Only the agent needs a private subnet,</text>
  <text x="1025" y="694" text-anchor="middle" fill="#64748b">and it is in AZ 1. AZ 2 is here only</text>
  <text x="1025" y="712" text-anchor="middle" fill="#64748b">because the ALB needs two AZs.</text>

  <!-- Agent -->
  <rect x="380" y="580" width="370" height="215" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="392" y="602" font-size="13" font-weight="700">Agent EC2 · build + app</text>
  <text x="392" y="620">questly-dev-agent</text>
  <text x="392" y="638">t3.medium · 18 GB gp3</text>
  <text x="392" y="656">Ubuntu 24.04</text>
  <text x="392" y="674" font-weight="700">No public IP</text>
  <text x="392" y="692">Docker · kind · kubectl</text>
  <text x="392" y="710">+ Java 21</text>
  <text x="392" y="728">SG: questly-dev-agent-sg</text>
  <text x="392" y="746">Key: questly-dev-key</text>
  <rect x="592" y="596" width="148" height="186" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-dasharray="5 3"/>
  <text x="602" y="616" font-weight="700" fill="#0369a1">kind cluster</text>
  <text x="602" y="638">frontend   :30080</text>
  <text x="602" y="658">backend    :30081</text>
  <text x="602" y="678">Grafana    :30030</text>
  <text x="602" y="698">Prometheus :30090</text>
  <text x="602" y="722" fill="#64748b">(NodePorts; app is</text>
  <text x="602" y="740" fill="#64748b">deployed later by</text>
  <text x="602" y="758" fill="#64748b">Jenkins)</text>

  <!-- Route tables -->
  <rect x="355" y="835" width="410" height="160" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="370" y="858" font-size="13" font-weight="700">Public route table · questly-dev-public-rt</text>
  <text x="370" y="878">Attached to: public subnet 1 + public subnet 2</text>
  <text x="370" y="904" font-weight="700">Destination</text><text x="520" y="904" font-weight="700">Target</text>
  <line x1="370" y1="910" x2="740" y2="910" stroke="#d1d5db"/>
  <text x="370" y="926">10.0.0.0/16</text><text x="520" y="926">local</text>
  <text x="370" y="946">0.0.0.0/0</text><text x="520" y="946">internet gateway</text>
  <text x="370" y="976" fill="#15803d">This route is what makes these subnets public.</text>

  <rect x="815" y="835" width="420" height="160" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="830" y="858" font-size="13" font-weight="700">Private route table · questly-dev-private-rt</text>
  <text x="830" y="878">Attached to: the private subnet (AZ 1)</text>
  <text x="830" y="904" font-weight="700">Destination</text><text x="980" y="904" font-weight="700">Target</text>
  <line x1="830" y1="910" x2="1210" y2="910" stroke="#d1d5db"/>
  <text x="830" y="926">10.0.0.0/16</text><text x="980" y="926">local</text>
  <text x="830" y="946">0.0.0.0/0</text><text x="980" y="946">NAT gateway (in public subnet 1)</text>
  <text x="830" y="976" fill="#1d4ed8">Outbound only: nothing outside can connect in.</text>

  <!-- ============ RIGHT panel ============ -->
  <rect x="1290" y="80" width="290" height="200" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1305" y="104" font-size="14" font-weight="700">IAM (global, not in the VPC)</text>
  <text x="1305" y="128">Role: questly-dev-ec2-role</text>
  <text x="1305" y="150">↓ policy AmazonSSMManagedInstanceCore</text>
  <text x="1305" y="172">↓ instance profile</text>
  <text x="1319" y="190">questly-dev-ec2-profile</text>
  <text x="1305" y="214">Attached to master + agent</text>
  <text x="1305" y="236">→ Session Manager shell, no SSH needed</text>

  <rect x="1290" y="300" width="290" height="100" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="1305" y="324" font-size="14" font-weight="700">EC2 key pair: questly-dev-key</text>
  <text x="1305" y="346">AWS's copy of your PUBLIC key</text>
  <text x="1305" y="366">Used by master + agent</text>
  <text x="1305" y="386">Private key never leaves your laptop</text>

  <rect x="1290" y="420" width="290" height="350" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1305" y="444" font-size="14" font-weight="700">Security groups (3) · rules (13)</text>
  <text x="1305" y="470" font-weight="700" fill="#b91c1c">questly-dev-alb-sg (ALB)</text>
  <text x="1315" y="490">In 80, 443 from anywhere</text>
  <text x="1315" y="508">Out 30080, 30081 → agent SG only</text>
  <text x="1305" y="536" font-weight="700" fill="#b91c1c">questly-dev-master-sg (master)</text>
  <text x="1315" y="556">In 22, 8080 from your IP only</text>
  <text x="1315" y="574">Out: all</text>
  <text x="1305" y="602" font-weight="700" fill="#b91c1c">questly-dev-agent-sg (agent)</text>
  <text x="1315" y="622">In 22 from master SG</text>
  <text x="1315" y="640">In 30080, 30081 from ALB SG</text>
  <text x="1315" y="658">In 30030, 30090 from master SG</text>
  <text x="1315" y="676">Out: all (leaves through the NAT)</text>
  <text x="1305" y="708" font-weight="700">The ALB can reach only the agent.</text>
  <text x="1305" y="728">The master accepts connections</text>
  <text x="1305" y="746">only from your IP.</text>

  <rect x="1290" y="790" width="290" height="215" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="1305" y="814" font-size="14" font-weight="700">Arrows</text>
  <line x1="1305" y1="834" x2="1340" y2="834" stroke="#2563eb" stroke-width="3"/><text x="1350" y="838">users → ALB → agent</text>
  <line x1="1305" y1="854" x2="1340" y2="854" stroke="#ea580c" stroke-width="3"/><text x="1350" y="858">you → master (SSH, Jenkins)</text>
  <line x1="1305" y1="874" x2="1340" y2="874" stroke="#7c3aed" stroke-width="3"/><text x="1350" y="878">master → agent (SSH, monitoring)</text>
  <line x1="1305" y1="894" x2="1340" y2="894" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/><text x="1350" y="898">agent → internet via NAT</text>
  <line x1="1305" y1="914" x2="1340" y2="914" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4"/><text x="1350" y="918">certificate (set up by hand)</text>
  <text x="1305" y="946" fill="#64748b">Zone names come from AWS at plan</text>
  <text x="1305" y="964" fill="#64748b">time (likely ap-south-1a and 1b).</text>
  <text x="1305" y="986" fill="#64748b">Private IPs are picked by AWS.</text>

  <!-- ============ ARROWS ============ -->
  <!-- users → IGW → ALB -->
  <path d="M300 64 H700" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="420" y="58" font-weight="700" fill="#2563eb">HTTPS 443 · HTTP 80</text>
  <path d="M790 104 V403" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="797" y="330" font-weight="700" fill="#2563eb">users</text>

  <!-- ALB → agent -->
  <path d="M640 495 V578" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="634" y="519" font-weight="700" fill="#2563eb" text-anchor="end">HTTP 30080</text>
  <path d="M700 495 V578" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="706" y="519" font-weight="700" fill="#2563eb">HTTP 30081</text>

  <!-- admin → IGW → master -->
  <path d="M300 156 H310 V74 H700" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <text x="420" y="91" font-weight="700" fill="#ea580c">SSH 22 · Jenkins 8080 (your IP only)</text>
  <path d="M730 104 V198" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>

  <!-- master → agent -->
  <path d="M560 372 H362 V612 H378" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <text x="368" y="519" font-weight="700" fill="#7c3aed">SSH 22 · 30030 · 30090</text>

  <!-- agent → NAT → IGW (outbound) -->
  <path d="M380 690 H347 V245 H368" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#a-green)"/>
  <path d="M540 215 H550 V120 H715 V106" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#a-green)"/>
  <text x="333" y="600" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle" transform="rotate(-90 333 600)">outbound only</text>

  <!-- ACM certificate → ALB -->
  <path d="M300 455 H368" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-grey)"/>
</svg>

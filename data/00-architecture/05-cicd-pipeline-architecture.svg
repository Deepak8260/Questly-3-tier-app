<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker></defs>
<rect width="1500" height="930" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1f2937">5. CI/CD pipeline architecture: from git push to a running app</text>
<text x="20" y="52" font-size="13" fill="#64748b">Jenkins master-agent. The Jenkinsfile deploys images that are already on Docker Hub; it does not build them.</text>
<rect x="20" y="85" width="250" height="175" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="32" y="107" font-size="14" font-weight="700" fill="#1f2937">Developer laptop</text>
<text x="32" y="129" font-size="12" font-weight="700" fill="#1f2937">Code changes:</text>
<text x="32" y="147" font-size="12" fill="#1f2937">git push origin main</text>
<text x="32" y="165" font-size="12" font-weight="700" fill="#1f2937">New app version:</text>
<text x="32" y="183" font-size="12" fill="#1f2937">docker build + docker push</text>
<text x="32" y="201" font-size="12" fill="#64748b">(by hand, see the Docker</text>
<text x="32" y="219" font-size="12" fill="#64748b">guides)</text>
<rect x="340" y="85" width="260" height="175" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="352" y="107" font-size="14" font-weight="700" fill="#1f2937">GitHub</text>
<text x="352" y="129" font-size="12" fill="#1f2937">Deepak8260/Questly-3-tier-app</text>
<text x="352" y="147" font-size="12" fill="#1f2937">branch main</text>
<text x="352" y="183" font-size="12" font-weight="700" fill="#1f2937">Webhook</text>
<text x="352" y="201" font-size="12" fill="#1f2937">push event → POST</text>
<text x="352" y="219" font-size="12" fill="#1f2937">http://&lt;master-ip&gt;:8080/</text>
<text x="352" y="237" font-size="12" fill="#1f2937">github-webhook/</text>
<rect x="670" y="85" width="330" height="175" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="682" y="107" font-size="14" font-weight="700" fill="#2563eb">Jenkins master (questly-dev-master)</text>
<text x="682" y="129" font-size="12" fill="#1f2937">public subnet · Elastic IP</text>
<text x="682" y="146" font-size="12" font-weight="700" fill="#1f2937">Job questly</text>
<text x="682" y="163" font-size="12" fill="#1f2937">trigger: GitHub hook trigger</text>
<text x="682" y="180" font-size="12" fill="#1f2937">Pipeline script from SCM → Jenkinsfile</text>
<text x="682" y="197" font-size="12" font-weight="700" fill="#1f2937">Credentials</text>
<text x="682" y="214" font-size="12" fill="#1f2937">github-token, gmail-smtp, agent-ssh-key</text>
<text x="682" y="231" font-size="12" fill="#64748b">Never builds or deploys itself</text>
<rect x="1070" y="85" width="410" height="175" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="1082" y="107" font-size="14" font-weight="700" fill="#ea580c">Jenkins agent flask-builder (questly-dev-agent)</text>
<text x="1082" y="129" font-size="12" fill="#1f2937">private subnet · no public IP</text>
<text x="1082" y="146" font-size="12" fill="#1f2937">Java 21, Docker, kind, kubectl</text>
<text x="1082" y="163" font-size="12" font-weight="700" fill="#1f2937">Workspace</text>
<text x="1082" y="180" font-size="12" fill="#1f2937">/home/ubuntu/pipeline-workspace/workspace/questly</text>
<text x="1082" y="197" font-size="12" font-weight="700" fill="#1f2937">Kept by hand, once (not in git):</text>
<text x="1082" y="214" font-size="12" fill="#1f2937">backend/.env, frontend/.env</text>
<path d="M270 130 L338 130" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-grey)"/>
<text x="304" y="122" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">git push</text>
<path d="M600 130 L668 130" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/>
<text x="634" y="108" font-size="11" font-weight="700" text-anchor="middle" fill="#16a34a">webhook</text>
<text x="634" y="122" font-size="11" font-weight="700" text-anchor="middle" fill="#16a34a">:8080</text>
<text x="634" y="160" font-size="10" text-anchor="middle" fill="#64748b">allowed by</text>
<text x="634" y="172" font-size="10" text-anchor="middle" fill="#64748b">webhook_cidrs</text>
<path d="M1000 130 L1068 130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
<text x="1034" y="108" font-size="11" font-weight="700" text-anchor="middle" fill="#2563eb">SSH :22</text>
<text x="1034" y="122" font-size="11" font-weight="700" text-anchor="middle" fill="#2563eb">runs job</text>
<rect x="20" y="330" width="250" height="170" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="32" y="352" font-size="14" font-weight="700" fill="#0891b2">Docker Hub</text>
<text x="32" y="374" font-size="12" fill="#1f2937">kumar3472/questly-frontend</text>
<text x="32" y="392" font-size="12" fill="#1f2937">kumar3472/questly-backend</text>
<text x="32" y="410" font-size="12" fill="#64748b">tag :latest, public</text>
<text x="32" y="446" font-size="12" fill="#64748b">Pulled by the kind cluster</text>
<text x="32" y="464" font-size="12" fill="#64748b">in step 6 of deploy.sh</text>
<path d="M145 260 L145 328" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a-teal)"/>
<text x="153" y="298" font-size="11" font-weight="700" fill="#0891b2">docker push</text>
<rect x="340" y="300" width="1140" height="500" rx="8" fill="#fffaf5" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="356" y="324" font-size="14" font-weight="700" fill="#ea580c">One pipeline run on the agent (Jenkinsfile)</text>
<path d="M1275 260 L1275 298" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
<text x="1283" y="284" font-size="11" font-weight="700" fill="#ea580c">build starts</text>
<rect x="360" y="345" width="250" height="200" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="372" y="367" font-size="13" font-weight="700" fill="#ea580c">Stage 1: Checkout Source Code</text>
<text x="372" y="389" font-size="12" fill="#1f2937">git branch: BRANCH (main)</text>
<text x="372" y="406" font-size="12" fill="#1f2937">credentialsId: github-token</text>
<text x="372" y="440" font-size="12" fill="#64748b">Updates the code in the</text>
<text x="372" y="457" font-size="12" fill="#64748b">workspace. The .env files</text>
<text x="372" y="474" font-size="12" fill="#64748b">stay, because git ignores</text>
<text x="372" y="491" font-size="12" fill="#64748b">them.</text>
<rect x="650" y="345" width="430" height="430" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="662" y="367" font-size="13" font-weight="700" fill="#ea580c">Stage 2: Deploy to kind  (bash k8s/deploy.sh)</text>
<text x="662" y="389" font-size="12" font-weight="700" fill="#1f2937">[1/8]</text>
<text x="706" y="389" font-size="12" fill="#1f2937">check docker, kubectl, kind</text>
<text x="662" y="408" font-size="12" font-weight="700" fill="#1f2937">[2/8]</text>
<text x="706" y="408" font-size="12" fill="#1f2937">check Docker is running</text>
<text x="662" y="427" font-size="12" font-weight="700" fill="#1f2937">[3/8]</text>
<text x="706" y="427" font-size="12" fill="#1f2937">create the kind cluster &quot;questly&quot;</text>
<text x="706" y="446" font-size="12" fill="#64748b">skipped if it already exists</text>
<text x="662" y="465" font-size="12" font-weight="700" fill="#1f2937">[4/8]</text>
<text x="706" y="465" font-size="12" fill="#1f2937">kubectl get nodes</text>
<text x="662" y="484" font-size="12" font-weight="700" fill="#1f2937">[5/8]</text>
<text x="706" y="484" font-size="12" fill="#1f2937">namespace questly-ns + two secrets</text>
<text x="706" y="503" font-size="12" fill="#64748b">from backend/.env and frontend/.env</text>
<text x="662" y="522" font-size="12" font-weight="700" fill="#1f2937">[6/8]</text>
<text x="706" y="522" font-size="12" fill="#1f2937">kubectl apply backend.yml, frontend.yml</text>
<text x="706" y="541" font-size="12" fill="#64748b">rollout restart → pods pull :latest</text>
<text x="662" y="560" font-size="12" font-weight="700" fill="#1f2937">[7/8]</text>
<text x="706" y="560" font-size="12" fill="#1f2937">wait until both are rolled out</text>
<text x="662" y="579" font-size="12" font-weight="700" fill="#1f2937">[8/8]</text>
<text x="706" y="579" font-size="12" fill="#1f2937">monitoring stack</text>
<text x="706" y="598" font-size="12" fill="#64748b">Prometheus, Loki, Alloy, Grafana, node-exporter</text>
<text x="662" y="636" font-size="12" font-weight="700" fill="#16a34a">Prints QUESTLY IS RUNNING</text>
<rect x="1120" y="345" width="340" height="300" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1132" y="367" font-size="13" font-weight="700" fill="#7c3aed">post { }  after the stages</text>
<text x="1132" y="389" font-size="12" font-weight="700" fill="#1f2937">always</text>
<text x="1142" y="406" font-size="12" fill="#1f2937">kubectl -n questly-ns get pods</text>
<text x="1132" y="423" font-size="12" font-weight="700" fill="#16a34a">success</text>
<text x="1142" y="440" font-size="12" fill="#1f2937">emailext: &quot;Build Success&quot;</text>
<text x="1142" y="457" font-size="12" fill="#64748b">HTML mail with the build details</text>
<text x="1132" y="474" font-size="12" font-weight="700" fill="#dc2626">failure</text>
<text x="1142" y="491" font-size="12" fill="#1f2937">emailext: &quot;Build Failed&quot;</text>
<text x="1142" y="508" font-size="12" fill="#64748b">with a link to the console log</text>
<text x="1132" y="542" font-size="12" font-weight="700" fill="#1f2937">Options</text>
<text x="1142" y="559" font-size="12" fill="#1f2937">timestamps, no two builds at once,</text>
<text x="1142" y="576" font-size="12" fill="#1f2937">stop after 20 minutes</text>
<path d="M610 445 L648 445" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
<path d="M1080 445 L1118 445" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a-orange)"/>
<path d="M270 470 L300 470 L300 562 L648 562" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a-teal)"/>
<text x="640" y="557" font-size="11" font-weight="700" text-anchor="end" fill="#0891b2">pull :latest</text>
<rect x="360" y="580" width="250" height="195" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="372" y="602" font-size="13" font-weight="700" fill="#d97706">The .env files</text>
<text x="372" y="624" font-size="12" fill="#1f2937">Put in the workspace once,</text>
<text x="372" y="641" font-size="12" fill="#1f2937">by hand (Jenkins guide 3).</text>
<text x="372" y="675" font-size="12" fill="#1f2937">Step 5 turns them into the</text>
<text x="372" y="692" font-size="12" fill="#1f2937">Kubernetes secrets on every</text>
<text x="372" y="709" font-size="12" fill="#1f2937">build, so a changed value is</text>
<text x="372" y="726" font-size="12" fill="#1f2937">picked up by the next build.</text>
<path d="M610 620 L648 620" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a-amber)"/>
<rect x="1120" y="670" width="340" height="105" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1132" y="692" font-size="13" font-weight="700" fill="#7c3aed">Gmail SMTP</text>
<text x="1132" y="714" font-size="12" fill="#1f2937">smtp.gmail.com:465 (SSL), gmail-smtp</text>
<text x="1132" y="731" font-size="12" fill="#1f2937">to: the address in the Jenkinsfile</text>
<text x="1132" y="748" font-size="12" fill="#64748b">(outgoing only; no inbound port needed)</text>
<path d="M1290 645 L1290 668" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="340" y="820" width="1140" height="95" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="352" y="842" font-size="13" font-weight="700" fill="#16a34a">Result</text>
<text x="352" y="864" font-size="12" fill="#1f2937">The new pods run in the kind cluster on the agent. The load balancer sends https://questly.kumardevops.online to them once</text>
<text x="352" y="882" font-size="12" fill="#1f2937">their health checks pass (/ for the frontend, /health for the backend). The developer gets the email.</text>
<path d="M865 775 L865 818" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/>
<rect x="20" y="540" width="250" height="156" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="34" y="562" font-size="13" font-weight="700" fill="#1f2937">Arrows</text>
<line x1="34" y1="580" x2="66" y2="580" stroke="#64748b" stroke-width="3"/>
<text x="76" y="584" font-size="11.5" fill="#1f2937">code</text>
<line x1="34" y1="600" x2="66" y2="600" stroke="#16a34a" stroke-width="3"/>
<text x="76" y="604" font-size="11.5" fill="#1f2937">webhook / result</text>
<line x1="34" y1="620" x2="66" y2="620" stroke="#2563eb" stroke-width="3"/>
<text x="76" y="624" font-size="11.5" fill="#1f2937">master → agent</text>
<line x1="34" y1="640" x2="66" y2="640" stroke="#ea580c" stroke-width="3"/>
<text x="76" y="644" font-size="11.5" fill="#1f2937">pipeline steps</text>
<line x1="34" y1="660" x2="66" y2="660" stroke="#0891b2" stroke-width="3"/>
<text x="76" y="664" font-size="11.5" fill="#1f2937">images</text>
<line x1="34" y1="680" x2="66" y2="680" stroke="#7c3aed" stroke-width="3"/>
<text x="76" y="684" font-size="11.5" fill="#1f2937">email</text>
</svg>

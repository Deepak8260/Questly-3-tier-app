<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#db2777"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker></defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1f2937">3. Kubernetes architecture: the kind cluster on the agent</text>
<text x="20" y="52" font-size="13" fill="#64748b">Created by k8s/deploy.sh: kind create cluster --config k8s/kind-config.yml, then kubectl apply.</text>
<rect x="20" y="75" width="1460" height="870" rx="8" fill="#fffaf5" stroke="#ea580c" stroke-width="2"/>
<text x="36" y="100" font-size="15" font-weight="700" fill="#ea580c">Agent EC2 (questly-dev-agent) · Ubuntu 24.04 · Docker</text>
<rect x="40" y="115" width="1190" height="815" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="56" y="140" font-size="14" font-weight="700" fill="#2563eb">kind cluster &quot;questly&quot;: Kubernetes running inside Docker containers</text>
<rect x="60" y="155" width="560" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="72" y="177" font-size="14" font-weight="700" fill="#2563eb">Node 1: questly-control-plane (a Docker container)</text>
<text x="72" y="199" font-size="12" fill="#1f2937">Kubernetes control plane: API server, etcd, scheduler,</text>
<text x="72" y="217" font-size="12" fill="#1f2937">controller manager. Also runs pods.</text>
<text x="72" y="235" font-size="12" font-weight="700" fill="#1f2937">extraPortMappings: agent ports 30080, 30081, 30030, 30090</text>
<text x="82" y="253" font-size="12" fill="#1f2937">are forwarded into this node</text>
<rect x="650" y="155" width="560" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="662" y="177" font-size="14" font-weight="700" fill="#2563eb">Node 2: questly-worker (a Docker container)</text>
<text x="662" y="199" font-size="12" fill="#1f2937">Runs pods.</text>
<text x="662" y="235" font-size="12" fill="#64748b">The scheduler decides which node runs each pod.</text>
<text x="662" y="253" font-size="12" fill="#64748b">kube-proxy on every node sends NodePort traffic</text>
<text x="662" y="271" font-size="12" fill="#64748b">to the right pod, wherever it runs.</text>
<rect x="60" y="325" width="560" height="590" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="76" y="348" font-size="13" font-weight="700" fill="#ea580c">Namespace: questly-ns  (k8s/namespace.yml)</text>
<rect x="80" y="365" width="250" height="260" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="92" y="387" font-size="13" font-weight="700" fill="#ea580c">Deployment: frontend</text>
<text x="92" y="409" font-size="11.5" fill="#1f2937">replicas: 1</text>
<text x="92" y="427" font-size="11.5" fill="#1f2937">kumar3472/questly-frontend</text>
<text x="92" y="445" font-size="11.5" fill="#64748b">  :latest</text>
<text x="92" y="463" font-size="11.5" fill="#1f2937">imagePullPolicy: Always</text>
<text x="92" y="481" font-size="11.5" fill="#1f2937">containerPort: 3000</text>
<text x="92" y="499" font-size="11.5" fill="#1f2937">envFrom: secret</text>
<text x="92" y="517" font-size="11.5" fill="#64748b">  questly-frontend-secrets</text>
<text x="92" y="535" font-size="11.5" fill="#1f2937">CPU 100m → 500m</text>
<text x="92" y="553" font-size="11.5" fill="#1f2937">memory 128Mi → 512Mi</text>
<text x="92" y="571" font-size="11.5" fill="#64748b">(requests → limits)</text>
<rect x="350" y="365" width="250" height="260" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="362" y="387" font-size="13" font-weight="700" fill="#ea580c">Deployment: backend</text>
<text x="362" y="409" font-size="11.5" fill="#1f2937">replicas: 1</text>
<text x="362" y="427" font-size="11.5" fill="#1f2937">kumar3472/questly-backend</text>
<text x="362" y="445" font-size="11.5" fill="#64748b">  :latest</text>
<text x="362" y="463" font-size="11.5" fill="#1f2937">imagePullPolicy: Always</text>
<text x="362" y="481" font-size="11.5" fill="#1f2937">containerPort: 3001</text>
<text x="362" y="499" font-size="11.5" fill="#1f2937">env PORT=3001</text>
<text x="362" y="517" font-size="11.5" fill="#1f2937">envFrom: secret</text>
<text x="362" y="535" font-size="11.5" fill="#64748b">  questly-backend-secrets</text>
<text x="362" y="553" font-size="11.5" fill="#1f2937">CPU 100m → 500m</text>
<text x="362" y="571" font-size="11.5" fill="#1f2937">memory 128Mi → 512Mi</text>
<rect x="80" y="660" width="250" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="92" y="682" font-size="13" font-weight="700" fill="#dc2626">Service: frontend</text>
<text x="92" y="704" font-size="11.5" fill="#1f2937">type NodePort</text>
<text x="92" y="722" font-size="11.5" fill="#1f2937">3000 → nodePort 30080</text>
<rect x="350" y="660" width="250" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="362" y="682" font-size="13" font-weight="700" fill="#dc2626">Service: backend</text>
<text x="362" y="704" font-size="11.5" fill="#1f2937">type NodePort</text>
<text x="362" y="722" font-size="11.5" fill="#1f2937">3001 → nodePort 30081</text>
<path d="M205 658 L205 627" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>
<path d="M475 658 L475 627" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>
<text x="340" y="646" font-size="10.5" text-anchor="middle" fill="#dc2626">selects the pods by label app: ...</text>
<rect x="80" y="780" width="520" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="92" y="802" font-size="13" font-weight="700" fill="#d97706">Secrets (made by deploy.sh from the .env files)</text>
<text x="92" y="824" font-size="11.5" fill="#1f2937">questly-frontend-secrets  ← frontend/.env in the Jenkins workspace</text>
<text x="92" y="842" font-size="11.5" fill="#1f2937">questly-backend-secrets   ← backend/.env in the Jenkins workspace</text>
<text x="92" y="860" font-size="11.5" fill="#64748b">Pods read them as environment variables when they start.</text>
<rect x="650" y="325" width="560" height="590" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="666" y="348" font-size="13" font-weight="700" fill="#7c3aed">Namespace: monitoring  (k8s/monitoring/)</text>
<rect x="670" y="365" width="255" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="682" y="387" font-size="13" font-weight="700" fill="#7c3aed">Prometheus (Deployment)</text>
<text x="682" y="409" font-size="11.5" fill="#1f2937">PVC prometheus-data</text>
<text x="682" y="426" font-size="11.5" fill="#1f2937">Service NodePort 30090</text>
<text x="682" y="443" font-size="11.5" fill="#1f2937">RBAC: may read nodes</text>
<text x="682" y="460" font-size="11.5" fill="#1f2937">scrapes every 15 s</text>
<rect x="940" y="365" width="255" height="120" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
<text x="952" y="387" font-size="13" font-weight="700" fill="#db2777">Grafana (Deployment)</text>
<text x="952" y="409" font-size="11.5" fill="#1f2937">PVC grafana-data</text>
<text x="952" y="426" font-size="11.5" fill="#1f2937">Service NodePort 30030</text>
<text x="952" y="443" font-size="11.5" fill="#1f2937">data sources: ConfigMap</text>
<text x="952" y="460" font-size="11.5" fill="#1f2937">login: secret grafana-admin</text>
<rect x="670" y="505" width="255" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="682" y="527" font-size="13" font-weight="700" fill="#0891b2">Loki (Deployment)</text>
<text x="682" y="549" font-size="11.5" fill="#1f2937">PVC loki-data</text>
<text x="682" y="566" font-size="11.5" fill="#1f2937">Service ClusterIP :3100</text>
<text x="682" y="583" font-size="11.5" fill="#1f2937">(inside the cluster only)</text>
<text x="682" y="600" font-size="11.5" fill="#1f2937">stores the logs</text>
<rect x="940" y="505" width="255" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="952" y="527" font-size="13" font-weight="700" fill="#0891b2">Alloy (Deployment)</text>
<text x="952" y="549" font-size="11.5" fill="#1f2937">RBAC: may list pods</text>
<text x="952" y="566" font-size="11.5" fill="#1f2937">reads every pod&#x27;s logs</text>
<text x="952" y="583" font-size="11.5" fill="#1f2937">pushes them to Loki</text>
<rect x="670" y="645" width="255" height="110" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="682" y="667" font-size="13" font-weight="700" fill="#7c3aed">node-exporter (DaemonSet)</text>
<text x="682" y="689" font-size="11.5" fill="#1f2937">one pod on every node</text>
<text x="682" y="706" font-size="11.5" fill="#1f2937">reads the node&#x27;s /</text>
<text x="682" y="723" font-size="11.5" fill="#1f2937">machine metrics :9100</text>
<rect x="940" y="645" width="255" height="110" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="952" y="667" font-size="13" font-weight="700" fill="#1f2937">Storage</text>
<text x="952" y="689" font-size="11.5" fill="#1f2937">Each PVC is a folder inside</text>
<text x="952" y="706" font-size="11.5" fill="#1f2937">the node container (kind&#x27;s</text>
<text x="952" y="723" font-size="11.5" fill="#1f2937">local storage). Lost when the</text>
<text x="952" y="740" font-size="11.5" fill="#1f2937">cluster is deleted.</text>
<rect x="670" y="780" width="525" height="120" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="684" y="802" font-size="11.5" font-weight="700" fill="#1f2937">How it fits together</text>
<text x="684" y="820" font-size="11.5" fill="#1f2937">Alloy → Loki: logs.  Prometheus ← node-exporter and the</text>
<text x="684" y="838" font-size="11.5" fill="#1f2937">kubelets&#x27; cAdvisor (through the API server): metrics.</text>
<text x="684" y="856" font-size="11.5" fill="#1f2937">Grafana reads both. Details in diagram 6.</text>
<rect x="1250" y="115" width="215" height="330" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1262" y="137" font-size="14" font-weight="700" fill="#1f2937">Ports on the agent</text>
<text x="1262" y="159" font-size="12" font-weight="700" fill="#1f2937">30080 → frontend</text>
<text x="1272" y="176" font-size="12" fill="#64748b">from the load balancer</text>
<text x="1262" y="193" font-size="12" font-weight="700" fill="#1f2937">30081 → backend</text>
<text x="1272" y="210" font-size="12" fill="#64748b">from the load balancer</text>
<text x="1262" y="227" font-size="12" font-weight="700" fill="#1f2937">30030 → Grafana</text>
<text x="1272" y="244" font-size="12" fill="#64748b">from the master (tunnel)</text>
<text x="1262" y="261" font-size="12" font-weight="700" fill="#1f2937">30090 → Prometheus</text>
<text x="1272" y="278" font-size="12" fill="#64748b">from the master (tunnel)</text>
<text x="1262" y="312" font-size="12" fill="#ea580c">All four go into Node 1 (orange</text>
<text x="1262" y="329" font-size="12" fill="#64748b">arrow). Allowed by the agent&#x27;s</text>
<text x="1262" y="346" font-size="12" fill="#64748b">security group only from the</text>
<text x="1262" y="363" font-size="12" fill="#64748b">load balancer and the master</text>
<path d="M1250 315 L340 315 L340 307" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#a-orange)"/>
<rect x="1250" y="470" width="215" height="445" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="1262" y="492" font-size="14" font-weight="700" fill="#1f2937">One request, step by step</text>
<text x="1262" y="514" font-size="12" font-weight="700" fill="#1f2937">1. Browser</text>
<text x="1272" y="531" font-size="12" fill="#1f2937">https://questly...</text>
<text x="1262" y="548" font-size="12" font-weight="700" fill="#1f2937">2. Load balancer</text>
<text x="1272" y="565" font-size="12" fill="#1f2937">→ agent port 30080</text>
<text x="1262" y="582" font-size="12" font-weight="700" fill="#1f2937">3. Docker</text>
<text x="1272" y="599" font-size="12" fill="#1f2937">→ control-plane node,</text>
<text x="1272" y="616" font-size="12" fill="#1f2937">port 30080</text>
<text x="1262" y="633" font-size="12" font-weight="700" fill="#1f2937">4. kube-proxy</text>
<text x="1272" y="650" font-size="12" fill="#1f2937">→ Service frontend</text>
<text x="1262" y="667" font-size="12" font-weight="700" fill="#1f2937">5. Service</text>
<text x="1272" y="684" font-size="12" fill="#1f2937">→ a frontend pod, port 3000</text>
<text x="1262" y="718" font-size="12" fill="#64748b">/api/* takes the same path with</text>
<text x="1262" y="735" font-size="12" fill="#64748b">30081 → backend pod, 3001.</text>
</svg>
